<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>README Preview · threetwoa's blog</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-light.min.css" />
  <link rel="stylesheet" href="./preview-readme.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header class="bar">
    <strong>README 预览壳</strong>
    <span id="status">加载中…</span>
    <button type="button" id="reload">重新加载</button>
  </header>
  <main class="markdown-body" id="content"></main>
  <footer class="bar foot">
    端口 8090 · 源文件 <code>README.md</code> · 配图见 <code>assets/images/readme/</code>
  </footer>
  <script>
    window.__PREVIEW_README__ = {
      title: "threetwoa's blog",
      file: "./README.md",
      portHint: "8090",
    };
  </script>
  <script src="./preview-readme.js"></script>
</body>
</html>
