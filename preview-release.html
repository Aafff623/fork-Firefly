<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Release Preview · v1.3.0 · threetwoa's blog</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown-light.min.css" />
  <link rel="stylesheet" href="./preview-release.css" />
</head>
<body>
  <header class="preview-toolbar">
    <div class="preview-toolbar__title" id="preview-title">threetwoa's blog · Release v1.3.0</div>
    <div class="preview-toolbar__actions">
      <div class="lang-tabs" role="tablist" aria-label="语言">
        <button type="button" id="tab-zh" class="is-active">中文</button>
        <button type="button" id="tab-en">English</button>
      </div>
      <button type="button" id="preview-reload">重新加载</button>
      <a class="preview-toolbar__link" href="./release-notes/v1.3.0.md" target="_blank" rel="noopener">原始 Markdown</a>
      <a class="preview-toolbar__link" href="https://github.com/Aafff623/fork-Firefly/releases/tag/v1.3.0" target="_blank" rel="noopener">GitHub Release</a>
      <span class="preview-toolbar__hint" id="preview-hint">需 HTTP 打开 · 端口 8090</span>
    </div>
  </header>

  <main class="preview-main">
    <p class="preview-meta" id="preview-meta"></p>

    <div class="preview-panels" id="preview-panels" data-mode="tabs">
      <section class="preview-panel is-visible" id="panel-zh" aria-label="中文">
        <div class="preview-panel__head">
          <span>中文 · 本版说明</span>
          <span class="preview-panel__badge">ZH</span>
        </div>
        <article class="markdown-body" id="preview-zh">加载中…</article>
      </section>

      <section class="preview-panel" id="panel-en" aria-label="English">
        <div class="preview-panel__head">
          <span>English · Release notes</span>
          <span class="preview-panel__badge">EN</span>
        </div>
        <article class="markdown-body" id="preview-en">Loading…</article>
      </section>
    </div>

    <p class="preview-status" id="preview-status"></p>
  </main>

  <footer class="preview-footer" id="preview-footer"></footer>

  <script>
    window.__PREVIEW_RELEASE__ = {
      title: "threetwoa's blog · Release Preview · v1.3.0",
      hint: "请用 python -m http.server 8090 后访问本页；file:// 无法 fetch。",
      portError: "无法加载 release notes。请在仓库根执行：python -m http.server 8090，然后打开 http://127.0.0.1:8090/preview-release.html",
      footer: "源文件 release-notes/v1.3.0.md · GitHub: https://github.com/Aafff623/fork-Firefly/releases/tag/v1.3.0 · Live: https://www.threetwoa.live",
      notesFile: "./release-notes/v1.3.0.md",
      meta: "宽屏：中英双栏并排 · 窄屏：顶部切换中文 / English · 与 README 预览壳同属 8090 端口 · 草稿未发布前 GitHub 链接 404 属正常"
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="./preview-release.js"></script>
</body>
</html>
