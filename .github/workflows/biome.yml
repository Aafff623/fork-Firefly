name: Code quality

on:
  push:
    branches: [ master ] # Adjust branches as needed
  pull_request:
    branches: [ master ] # Adjust branches as needed

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Biome
        uses: biomejs/setup-biome@f382a98e582959e6aaac8e5f8b17b31749018780 # v2.5.0
        with:
          # 与 package.json devDependencies 的 @biomejs/biome 对齐；
          # 用 latest 会让 CI 判定随上游版本漂移，本地绿、CI 红（或反之）无法复现。
          version: 2.5.5
      - name: Run Biome
        run: biome ci ./src --reporter=github
