name: Deploy to Cloudflare Workers

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: cf-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build (Cloudflare Workers adapter)
        run: pnpm run build
        env:
          CF_WORKERS: '1'
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Strip unused bindings from generated wrangler config
        run: |
          node -e "const fs=require('fs');const p='dist/server/wrangler.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));delete c.kv_namespaces;delete c.images;delete c.previews;fs.writeFileSync(p,JSON.stringify(c,null,2));"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
