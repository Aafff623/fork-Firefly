name: Deploy to Cloudflare Workers

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: cf-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run behavior gates
        run: pnpm run check:behavior

      - name: Astro check
        run: pnpm run check

      - name: Build (Cloudflare Workers adapter)
        run: pnpm run build
        env:
          CF_WORKERS: '1'
          NODE_OPTIONS: --max-old-space-size=4096

      # 产物级交付预算门禁：复用上面这次构建的 dist，不额外多跑一遍 build。
      # 阈值与白名单唯一定义在 src/lib/delivery-budget.ts；超预算即拦下部署。
      #
      # 注意：这里**只**放产物级门禁。四个源码门禁（check:gates）当前在 master 上有
      # 4 条历史失败（v41 的 AskChat 孤儿 chunk、ui-motion 的时钟/页脚/tag sphere 三条），
      # 放进部署前会直接堵住上线。它们在 build.yml 里跑，先把红灯亮出来，修完再挪过来。
      - name: Check v41 dist gates
        run: node scripts/check-v41-gates.mjs

      - name: Check delivery budget
        run: pnpm run check:budget

      - name: Strip unused bindings from generated wrangler config
        run: |
          node -e "const fs=require('fs');const p='dist/server/wrangler.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));delete c.kv_namespaces;delete c.images;delete c.previews;fs.writeFileSync(p,JSON.stringify(c,null,2));"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
