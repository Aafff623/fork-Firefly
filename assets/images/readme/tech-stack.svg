  <text x="132" y="781" class="bottom-title" fill="#FFFFFF">DECISION LENS</text>
  <text x="360" y="781" class="bottom-copy" fill="#E1E0E4">static-first</text>
  <circle cx="464" cy="777" r="4" fill="#2F5BDB"/>
  <text x="500" y="781" class="bottom-copy" fill="#E1E0E4">config-driven</text>
