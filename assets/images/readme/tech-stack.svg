  <rect x="892" y="476" width="112" height="38" fill="#FFFFFF" stroke="#D7A444"/><text x="914" y="500" class="chip">Sharp</text>
  <rect x="1018" y="476" width="138" height="38" fill="#FFFFFF" stroke="#D7A444"/><text x="1040" y="500" class="chip">Pagefind</text>
