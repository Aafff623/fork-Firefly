<svg width="1600" height="860" viewBox="0 0 1600 860" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Firefly blog technology map</title>
  <desc id="desc">A structured technology map grouped by runtime core, publishing, interaction, build enrichment, delivery and optional services.</desc>
  <style>
    .eyebrow { font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2.4px; fill: #5B5960; }
    .title { font: 800 42px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -1.4px; fill: #20222A; }
    .subtitle { font: 400 17px ui-sans-serif, system-ui, sans-serif; fill: #66636A; }
    .rail-title { font: 800 15px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1.4px; fill: #20222A; }
    .rail-main { font: 800 26px ui-sans-serif, system-ui, sans-serif; fill: #20222A; }
    .rail-copy { font: 400 13px ui-sans-serif, system-ui, sans-serif; fill: #6B6865; }
    .lane-label { font: 800 14px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1.2px; fill: #20222A; }
    .lane-copy { font: 400 12px ui-sans-serif, system-ui, sans-serif; fill: #6B6865; }
    .chip { font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #20222A; }
    .chip-small { font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #20222A; }
    .bottom-title { font: 800 14px ui-sans-serif, system-ui, sans-serif; fill: #20222A; }
    .bottom-copy { font: 400 12px ui-sans-serif, system-ui, sans-serif; fill: #6B6865; }
  </style>

  <rect width="1600" height="860" fill="#F7F3EC"/>
