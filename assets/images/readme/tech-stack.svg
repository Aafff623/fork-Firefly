  <rect x="854" y="570" width="118" height="38" fill="#FFFFFF" stroke="#6EB894"/><text x="879" y="594" class="chip">Vercel</text>
  <rect x="986" y="570" width="170" height="38" fill="#FFFFFF" stroke="#6EB894"/><text x="1004" y="594" class="chip-small">Cloudflare adapter</text>
  <text x="1220" y="588" class="lane-copy">ship static</text>
  <text x="1220" y="604" class="lane-copy">→ CDN</text>

  <rect x="456" y="646" width="1030" height="78" fill="#F0EAFE" stroke="#BBA3E8"/>
  <rect x="456" y="646" width="8" height="78" fill="#7B56D8"/>
  <text x="486" y="675" class="lane-label">OPTIONAL SERVICES</text>
  <text x="486" y="698" class="lane-copy">configuration-gated integrations</text>
  <rect x="740" y="664" width="106" height="38" fill="#FFFFFF" stroke="#A482DC"/><text x="766" y="688" class="chip">Waline</text>
  <rect x="860" y="664" width="106" height="38" fill="#FFFFFF" stroke="#A482DC"/><text x="887" y="688" class="chip">Memos</text>
  <rect x="980" y="664" width="116" height="38" fill="#FFFFFF" stroke="#A482DC"/><text x="1004" y="688" class="chip-small">Tencent COS</text>
  <rect x="1110" y="664" width="116" height="38" fill="#FFFFFF" stroke="#A482DC"/><text x="1128" y="688" class="chip-small">Live2D / Spine</text>
  <text x="1220" y="682" class="lane-copy">off by</text>
  <text x="1220" y="698" class="lane-copy">default</text>

