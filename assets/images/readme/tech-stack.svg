  <text x="132" y="319" class="rail-main" fill="#FFFFFF">Astro</text>
  <text x="132" y="347" class="rail-copy" fill="#D1D0D5">Static generation is the default</text>
  <text x="132" y="367" class="rail-copy" fill="#D1D0D5">delivery model. Islands are opt-in.</text>
  <path d="M132 397H360" stroke="#565A66"/>
  <text x="132" y="435" class="rail-title" fill="#FFFFFF">7.1.3</text>
  <text x="132" y="460" class="rail-copy" fill="#D1D0D5">pages · layouts · content layer</text>
  <text x="132" y="510" class="rail-title" fill="#FFFFFF">Svelte 5</text>
  <text x="132" y="535" class="rail-copy" fill="#D1D0D5">interactive islands where needed</text>
  <text x="132" y="585" class="rail-title" fill="#FFFFFF">TypeScript 6</text>
  <text x="132" y="610" class="rail-copy" fill="#D1D0D5">typed configuration and UI contracts</text>
  <rect x="132" y="655" width="196" height="30" fill="#334477"/>
  <text x="148" y="675" class="chip-small" fill="#FFFFFF">STATIC-FIRST / CDN READY</text>

