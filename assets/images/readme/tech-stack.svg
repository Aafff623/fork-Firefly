  <rect x="908" y="382" width="110" height="38" fill="#FFFFFF" stroke="#DF8A84"/><text x="934" y="406" class="chip">Swup</text>
  <rect x="1032" y="382" width="124" height="38" fill="#FFFFFF" stroke="#DF8A84"/><text x="1054" y="406" class="chip">Three.js</text>
  <text x="1220" y="400" class="lane-copy">hydrate only</text>
  <text x="1220" y="416" class="lane-copy">where interaction pays</text>

  <rect x="456" y="458" width="1030" height="78" fill="#FFF0CD" stroke="#E7C16F"/>
  <rect x="456" y="458" width="8" height="78" fill="#D58A18"/>
