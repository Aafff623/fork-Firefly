  <text x="1220" y="306" class="lane-copy">content in</text>
  <text x="1220" y="322" class="lane-copy">→ typed model</text>

  <rect x="456" y="364" width="1030" height="78" fill="#FFE9E6" stroke="#E8AAA4"/>
  <rect x="456" y="364" width="8" height="78" fill="#D95C58"/>
  <text x="486" y="393" class="lane-label">INTERACTION</text>
  <text x="486" y="416" class="lane-copy">responsive surfaces and transitions</text>
