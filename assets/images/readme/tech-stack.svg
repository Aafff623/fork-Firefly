  <path d="M56 56V804M88 56V804M1512 56V804" stroke="#E2DDD4" stroke-width="1"/>
  <path d="M56 184H1544M56 744H1544" stroke="#D4CFC6" stroke-width="1"/>

  <text x="96" y="104" class="eyebrow">FIREfly / TECHNOLOGY MAP / 02</text>
  <text x="96" y="158" class="title">A stack with a point of view</text>
  <text x="96" y="193" class="subtitle">Small composable tools, grouped by the job they perform in the system.</text>
  <text x="1280" y="104" class="eyebrow">NODE 22+</text>
  <text x="1280" y="132" class="eyebrow">PNPM 9.14.4</text>

  <rect x="96" y="222" width="300" height="490" fill="#20222A"/>
  <rect x="96" y="222" width="8" height="490" fill="#2F5BDB"/>
