<svg width="1600" height="920" viewBox="0 0 1600 920" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Firefly blog architecture map</title>
  <desc id="desc">An editorial architecture map showing the Firefly blog flow from Markdown and configuration through Astro composition, build enrichment, static delivery and browser islands.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#DCD7CE" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#2F5BDB"/>
    </marker>
    <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#7E7A73"/>
    </marker>
    <style>
      .eyebrow { font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2.4px; fill: #5B5960; }
      .title { font: 800 42px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -1.4px; fill: #20222A; }
      .subtitle { font: 400 17px ui-sans-serif, system-ui, sans-serif; fill: #66636A; }
      .stage { font: 800 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1.3px; fill: #20222A; }
      .stage-no { font: 800 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #FFFFFF; }
      .node-title { font: 800 17px ui-sans-serif, system-ui, sans-serif; fill: #20222A; }
      .node-copy { font: 400 13px ui-sans-serif, system-ui, sans-serif; fill: #66636A; }
      .code { font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #30323B; }
      .tiny { font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #77736D; }
      .rule { font: 700 14px ui-sans-serif, system-ui, sans-serif; fill: #20222A; }
      .rule-copy { font: 400 12px ui-sans-serif, system-ui, sans-serif; fill: #6F6B68; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="#F7F3EC"/>
  <rect x="56" y="56" width="1488" height="808" fill="url(#grid)" opacity="0.62"/>
  <rect x="56" y="56" width="1488" height="808" stroke="#D4CFC6" stroke-width="1.5"/>

  <text x="96" y="104" class="eyebrow">FIREfly / SYSTEM MAP / 01</text>
  <text x="96" y="158" class="title">Static-first architecture</text>
  <text x="96" y="193" class="subtitle">A content pipeline with an intentionally thin browser layer.</text>
  <text x="1255" y="104" class="eyebrow">ASTRO 7.1.3</text>
  <text x="1255" y="132" class="tiny">SSG · CONFIG-DRIVEN · CDN READY</text>

  <line x1="138" y1="414" x2="1464" y2="414" stroke="#2F5BDB" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="138" y="385" class="eyebrow">PRIMARY FLOW / AUTHOR → BUILD → SHIP</text>

  <rect x="88" y="236" width="250" height="350" fill="#EAF0FF" stroke="#2F5BDB" stroke-width="2"/>
  <rect x="368" y="236" width="250" height="350" fill="#F2ECFF" stroke="#7B56D8" stroke-width="2"/>
  <rect x="648" y="236" width="250" height="350" fill="#FFF0CD" stroke="#D58A18" stroke-width="2"/>
  <rect x="928" y="236" width="250" height="350" fill="#E7F5EC" stroke="#2A9868" stroke-width="2"/>
  <rect x="1208" y="236" width="250" height="350" fill="#FFE9E6" stroke="#D95C58" stroke-width="2"/>

  <circle cx="116" cy="270" r="17" fill="#2F5BDB"/><text x="109" y="275" class="stage-no">01</text>
  <text x="145" y="275" class="stage">AUTHORING</text>
  <path d="M116 312H310" stroke="#AABBEA" stroke-width="1.5"/>
  <path d="M128 337H299V401H128Z" fill="#FFFFFF" stroke="#8FA6E7" stroke-width="1.5"/>
  <path d="M278 337L299 358H278Z" fill="#DCE6FF"/>
  <text x="145" y="369" class="node-title">Content</text>
  <text x="145" y="392" class="code">Markdown / MDX</text>
  <text x="128" y="438" class="code">src/content/</text>
  <text x="128" y="464" class="code">src/config/</text>
  <text x="128" y="512" class="node-copy">Posts, dynamic notes,</text>
  <text x="128" y="532" class="node-copy">special pages and site</text>
  <text x="128" y="552" class="node-copy">configuration enter here.</text>

  <circle cx="396" cy="270" r="17" fill="#7B56D8"/><text x="389" y="275" class="stage-no">02</text>
  <text x="425" y="275" class="stage">COMPOSITION</text>
  <path d="M396 312H590" stroke="#BFA9EA" stroke-width="1.5"/>
  <rect x="408" y="337" width="202" height="64" fill="#FFFFFF" stroke="#A482DC" stroke-width="1.5"/>
  <text x="425" y="365" class="node-title">Astro pages + layouts</text>
  <text x="425" y="386" class="node-copy">routes · templates · components</text>
  <rect x="408" y="425" width="94" height="54" fill="#E6DAFF" stroke="#A482DC"/>
  <text x="425" y="456" class="code">plugins</text>
  <rect x="516" y="425" width="94" height="54" fill="#E6DAFF" stroke="#A482DC"/>
  <text x="535" y="456" class="code">styles</text>
  <text x="408" y="520" class="node-copy">Content collections compose</text>
  <text x="408" y="540" class="node-copy">pages without turning the site</text>
  <text x="408" y="560" class="node-copy">into a client-side SPA.</text>

  <circle cx="676" cy="270" r="17" fill="#D58A18"/><text x="669" y="275" class="stage-no">03</text>
  <text x="705" y="275" class="stage">BUILD ENRICHMENT</text>
  <path d="M676 312H870" stroke="#E4C27B" stroke-width="1.5"/>
  <rect x="688" y="337" width="202" height="48" fill="#FFFFFF" stroke="#D7A444" stroke-width="1.5"/>
  <text x="705" y="366" class="code">Astro SSG</text>
  <rect x="688" y="403" width="94" height="54" fill="#FFE0A0" stroke="#D7A444"/>
  <text x="705" y="434" class="code">LQIP</text>
  <rect x="796" y="403" width="94" height="54" fill="#FFE0A0" stroke="#D7A444"/>
  <text x="808" y="434" class="code">fonts</text>
  <rect x="688" y="475" width="202" height="45" fill="#FFE0A0" stroke="#D7A444"/>
  <text x="705" y="503" class="code">Pagefind index</text>
  <text x="688" y="552" class="node-copy">Images, fonts, metadata and</text>
  <text x="688" y="572" class="node-copy">search are prepared before ship.</text>

  <circle cx="956" cy="270" r="17" fill="#2A9868"/><text x="949" y="275" class="stage-no">04</text>
  <text x="985" y="275" class="stage">DELIVERY</text>
  <path d="M956 312H1150" stroke="#92CBAE" stroke-width="1.5"/>
  <rect x="968" y="337" width="202" height="70" fill="#FFFFFF" stroke="#6EB894" stroke-width="1.5"/>
  <text x="985" y="367" class="node-title">dist/</text>
  <text x="985" y="391" class="node-copy">static output · CDN-ready</text>
  <rect x="968" y="433" width="94" height="54" fill="#CFEEDC" stroke="#6EB894"/>
  <text x="985" y="465" class="code">Vercel</text>
  <rect x="1076" y="433" width="94" height="54" fill="#CFEEDC" stroke="#6EB894"/>
  <text x="1091" y="465" class="code">Cloudflare</text>
  <text x="968" y="532" class="node-copy">Static by default; adapters</text>
  <text x="968" y="552" class="node-copy">only enter when explicit.</text>

  <circle cx="1236" cy="270" r="17" fill="#D95C58"/><text x="1229" y="275" class="stage-no">05</text>
  <text x="1265" y="275" class="stage">BROWSER LAYER</text>
  <path d="M1236 312H1430" stroke="#E6A5A0" stroke-width="1.5"/>
  <rect x="1248" y="337" width="202" height="48" fill="#FFFFFF" stroke="#DE8C87" stroke-width="1.5"/>
  <text x="1265" y="366" class="code">HTML / CSS</text>
  <rect x="1248" y="403" width="94" height="54" fill="#FFD0CB" stroke="#DE8C87"/>
  <text x="1265" y="435" class="code">Svelte</text>
  <rect x="1356" y="403" width="94" height="54" fill="#FFD0CB" stroke="#DE8C87"/>
  <text x="1372" y="435" class="code">Swup</text>
  <text x="1248" y="508" class="node-copy">Search, settings, transitions</text>
  <text x="1248" y="528" class="node-copy">and focused interactions only.</text>

  <rect x="88" y="636" width="1370" height="122" fill="#EFECE6" stroke="#C9C3B9" stroke-width="1.5"/>
  <text x="116" y="670" class="eyebrow">OPTIONAL SERVICE BOUNDARY / CONFIG-GATED</text>
  <rect x="116" y="694" width="196" height="38" fill="#FFFFFF" stroke="#8B6BC5"/><text x="132" y="719" class="code">Waline comments</text>
  <rect x="340" y="694" width="196" height="38" fill="#FFFFFF" stroke="#8B6BC5"/><text x="358" y="719" class="code">Memos / Dynamic</text>
  <rect x="564" y="694" width="196" height="38" fill="#FFFFFF" stroke="#8B6BC5"/><text x="582" y="719" class="code">Tencent COS</text>
  <rect x="788" y="694" width="196" height="38" fill="#FFFFFF" stroke="#8B6BC5"/><text x="807" y="719" class="code">Three.js canvas</text>
  <rect x="1012" y="694" width="196" height="38" fill="#FFFFFF" stroke="#8B6BC5"/><text x="1030" y="719" class="code">Live2D / Spine</text>
  <text x="1236" y="718" class="tiny">optional · explicit · isolated</text>
  <path d="M1333 586V636" stroke="#8B6BC5" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow-muted)"/>

  <line x1="88" y1="795" x2="1458" y2="795" stroke="#D4CFC6"/>
  <text x="96" y="832" class="rule">STATIC BY DEFAULT</text>
  <text x="96" y="852" class="rule-copy">Generate first. Hydrate only where interaction earns its cost.</text>
  <text x="532" y="832" class="rule">CONFIG OVER LAYOUT</text>
  <text x="532" y="852" class="rule-copy">Brand, pages and widgets stay close to the control surface.</text>
  <text x="1008" y="832" class="rule">VERSIONED ASSET</text>
  <text x="1008" y="852" class="rule-copy">This map belongs in the repository and changes with the code.</text>
</svg>
