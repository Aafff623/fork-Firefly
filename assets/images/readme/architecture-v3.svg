<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">threetwoa's blog architecture map</title>
  <desc id="desc">System map from Markdown and configuration through Astro composition and build enrichment to Cloudflare delivery and browser islands.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#9C7BE0"/>
    </marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .eyebrow{font-size:15px;letter-spacing:2px;font-weight:700}
      .title{font-size:34px;font-weight:800;fill:#EFEAD8}
      .small{font-size:16px}.label{font-size:19px;font-weight:800;fill:#EFEAD8}.body{font-size:17px;fill:#9C9DB8}
      .mono-s{font-size:16px;fill:#7A7DA3}
    </style>
  </defs>

  <rect width="1200" height="620" rx="24" fill="#0E1230"/>
  <rect x="20" y="20" width="1160" height="580" rx="18" fill="none" stroke="#232B54" stroke-width="2"/>
  <text x="58" y="72" class="mono eyebrow" fill="#9C9DB8">THREETWOA'S BLOG / SYSTEM MAP / V3</text>
  <text x="58" y="119" class="sans title">Static-first, from note to page</text>
  <text x="58" y="149" class="sans body">配置和内容进入构建链，浏览器只承载必要的交互。</text>
  <path d="M72 238 C270 215 440 260 610 234 S930 214 1124 239" fill="none" stroke="#9C7BE0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="rotate(-1 140 380)">
    <rect x="58" y="205" width="188" height="282" rx="18" fill="#161C42" stroke="#2A3161" stroke-width="2.5"/>
    <rect x="58" y="205" width="188" height="6" rx="3" fill="#7E96D4"/>
    <circle cx="86" cy="242" r="15" fill="#7E96D4"/><text x="78" y="248" class="mono small" fill="#0E1230" font-weight="700">01</text>
    <text x="112" y="248" class="sans label" fill="#7E96D4">AUTHORING</text>
    <path d="M82 272h138" stroke="#333A6B" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="82" y="312" class="sans label">Markdown / MDX</text>
    <text x="82" y="342" class="mono mono-s">src/content/</text>
    <text x="82" y="368" class="mono mono-s">src/config/</text>
    <text x="82" y="418" class="sans body">posts · dynamic</text>
    <text x="82" y="444" class="sans body">spec · site settings</text>
  </g>

  <g transform="rotate(1 370 380)">
    <rect x="268" y="205" width="188" height="282" rx="18" fill="#161C42" stroke="#2A3161" stroke-width="2.5"/>
    <rect x="268" y="205" width="188" height="6" rx="3" fill="#9C7BE0"/>
    <circle cx="296" cy="242" r="15" fill="#9C7BE0"/><text x="288" y="248" class="mono small" fill="#0E1230" font-weight="700">02</text>
    <text x="322" y="248" class="sans label" fill="#9C7BE0">COMPOSE</text>
    <path d="M292 272h138" stroke="#333A6B" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="292" y="312" class="sans label">Astro pages</text>
    <text x="292" y="342" class="sans body">layouts · components</text>
    <text x="292" y="368" class="sans body">plugins · styles</text>
    <text x="292" y="418" class="sans body">Content Collections</text>
    <text x="292" y="444" class="sans body">typed by schema</text>
  </g>

  <g transform="rotate(-1 600 380)">
    <rect x="478" y="205" width="188" height="282" rx="18" fill="#161C42" stroke="#2A3161" stroke-width="2.5"/>
    <rect x="478" y="205" width="188" height="6" rx="3" fill="#E8CF7E"/>
    <circle cx="506" cy="242" r="15" fill="#E8CF7E"/><text x="498" y="248" class="mono small" fill="#0E1230" font-weight="700">03</text>
    <text x="532" y="248" class="sans label" fill="#E8CF7E">BUILD</text>
    <path d="M502 272h138" stroke="#333A6B" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="502" y="312" class="sans label">Astro SSG</text>
    <text x="502" y="342" class="sans body">Sharp · LQIP</text>
    <text x="502" y="368" class="sans body">font subset</text>
    <text x="502" y="394" class="sans body">Pagefind index</text>
    <text x="502" y="438" class="sans body">贵的活在部署前完成</text>
  </g>

  <g transform="rotate(1 830 380)">
    <rect x="688" y="205" width="188" height="282" rx="18" fill="#161C42" stroke="#2A3161" stroke-width="2.5"/>
    <rect x="688" y="205" width="188" height="6" rx="3" fill="#74A88A"/>
    <circle cx="716" cy="242" r="15" fill="#74A88A"/><text x="708" y="248" class="mono small" fill="#0E1230" font-weight="700">04</text>
    <text x="742" y="248" class="sans label" fill="#74A88A">DELIVERY</text>
    <path d="M712 272h138" stroke="#333A6B" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="712" y="312" class="sans label">Workers</text>
    <text x="712" y="342" class="sans body">自定义域 + SSL</text>
    <text x="712" y="368" class="sans body">Cloudflare DNS</text>
    <text x="712" y="394" class="sans body">+ R2 图床</text>
    <text x="712" y="438" class="sans body">静态输出 · 少量 API</text>
  </g>

  <g transform="rotate(-1 1060 380)">
    <rect x="898" y="205" width="244" height="282" rx="18" fill="#161C42" stroke="#2A3161" stroke-width="2.5"/>
    <rect x="898" y="205" width="244" height="6" rx="3" fill="#C9899F"/>
    <circle cx="926" cy="242" r="15" fill="#C9899F"/><text x="918" y="248" class="mono small" fill="#0E1230" font-weight="700">05</text>
    <text x="952" y="248" class="sans label" fill="#C9899F">BROWSER</text>
    <path d="M922 272h194" stroke="#333A6B" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="922" y="312" class="sans label">HTML / CSS</text>
    <text x="922" y="342" class="sans body">Svelte islands</text>
    <text x="922" y="368" class="sans body">Swup transitions</text>
    <text x="922" y="394" class="sans body">Giscus / Waline</text>
    <text x="922" y="444" class="sans body">按需注水，内容先到</text>
  </g>

  <text x="60" y="554" class="mono mono-s">AUTHOR → COMPOSE → BUILD → SHIP → INTERACT</text>
  <text x="1140" y="554" text-anchor="end" class="mono mono-s">STATIC-FIRST · CLOUDFLARE ONLY</text>
</svg>
