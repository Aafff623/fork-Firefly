<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">post-publish agent publishing pipeline</title>
  <desc id="desc">Five-stage agent publishing chain for the blog: recognize input, settle into the Obsidian vault, build and validate the post, publish from the draft box after owner approval, then cascade checks through CI to the live domain.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#9C7BE0"/>
    </marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .stage-en{font-size:15px;font-weight:700;letter-spacing:1.5px}
      .stage-title{font-size:21px;font-weight:800;fill:#EFEAD8}
      .stage-body{font-size:16px;fill:#9C9DB8}
      .chip{font-size:16px;fill:#D8D9E8}
    </style>
  </defs>

  <rect width="1200" height="410" rx="26" fill="#0E1230"/>

  <text x="56" y="76" class="mono" font-size="15" letter-spacing="2.5" fill="#9C9DB8">AGENT PUBLISHING PIPELINE / POST-PUBLISH</text>
  <text x="56" y="120" class="sans" font-size="34" font-weight="800" fill="#EFEAD8">从一句话到上线，一条链走完</text>
  <text x="56" y="152" class="sans" font-size="17" fill="#9C9DB8">输入自动识别：Obsidian 笔记 / 对话提炼 / 外部文章 / 粘贴 / RSS 口令</text>

  <!-- stage cards -->
  <g>
    <rect x="48" y="190" width="200" height="140" rx="16" fill="#161C42" stroke="#2A3161"/>
    <rect x="48" y="190" width="200" height="5" rx="2.5" fill="#7E96D4"/>
    <circle cx="76" cy="224" r="15" fill="#7E96D4"/>
    <text x="76" y="229" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#0E1230">01</text>
    <text x="100" y="229" class="mono stage-en" fill="#7E96D4">RECOGNIZE</text>
    <text x="72" y="264" class="sans stage-title">识别输入</text>
    <text x="72" y="292" class="sans stage-body">笔记·对话·RSS</text>
    <text x="72" y="316" class="sans stage-body">自动分流四渠道</text>
  </g>
  <line x1="252" y1="260" x2="270" y2="260" stroke="#9C7BE0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="278" y="190" width="200" height="140" rx="16" fill="#161C42" stroke="#2A3161"/>
    <rect x="278" y="190" width="200" height="5" rx="2.5" fill="#9C7BE0"/>
    <circle cx="306" cy="224" r="15" fill="#9C7BE0"/>
    <text x="306" y="229" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#0E1230">02</text>
    <text x="330" y="229" class="mono stage-en" fill="#a78bfa">SETTLE</text>
    <text x="302" y="264" class="sans stage-title">沉淀 vault</text>
    <text x="302" y="292" class="sans stage-body">写回 Obsidian</text>
    <text x="302" y="316" class="sans stage-body">create / update 时间</text>
  </g>
  <line x1="482" y1="260" x2="500" y2="260" stroke="#9C7BE0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="508" y="190" width="200" height="140" rx="16" fill="#161C42" stroke="#2A3161"/>
    <rect x="508" y="190" width="200" height="5" rx="2.5" fill="#E8CF7E"/>
    <circle cx="536" cy="224" r="15" fill="#E8CF7E"/>
    <text x="536" y="229" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#0E1230">03</text>
    <text x="560" y="229" class="mono stage-en" fill="#E8CF7E">COMPOSE</text>
    <text x="532" y="264" class="sans stage-title">成帖校验</text>
    <text x="532" y="292" class="sans stage-body">图片压缩上 R2</text>
    <text x="532" y="316" class="sans stage-body">validate 红线门禁</text>
  </g>
  <line x1="712" y1="260" x2="730" y2="260" stroke="#9C7BE0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="738" y="190" width="200" height="140" rx="16" fill="#161C42" stroke="#2A3161"/>
    <rect x="738" y="190" width="200" height="5" rx="2.5" fill="#74A88A"/>
    <circle cx="766" cy="224" r="15" fill="#74A88A"/>
    <text x="766" y="229" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#0E1230">04</text>
    <text x="790" y="229" class="mono stage-en" fill="#74A88A">RELEASE</text>
    <text x="762" y="264" class="sans stage-title">发布出箱</text>
    <text x="762" y="292" class="sans stage-body">先进 _draftbox 箱</text>
    <text x="762" y="316" class="sans stage-body">园主确认再出箱</text>
  </g>
  <line x1="942" y1="260" x2="960" y2="260" stroke="#9C7BE0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="968" y="190" width="184" height="140" rx="16" fill="#161C42" stroke="#2A3161"/>
    <rect x="968" y="190" width="184" height="5" rx="2.5" fill="#9C7BE0"/>
    <circle cx="996" cy="224" r="15" fill="#9C7BE0"/>
    <text x="996" y="229" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#0E1230">05</text>
    <text x="1020" y="229" class="mono stage-en" fill="#9C7BE0">CASCADE</text>
    <text x="992" y="264" class="sans stage-title">级联收尾</text>
    <text x="992" y="292" class="sans stage-body">cascade_check</text>
    <text x="992" y="316" class="sans stage-body">push → CI → 核线上</text>
  </g>

  <!-- gates -->
  <text x="56" y="373" class="mono" font-size="16" letter-spacing="2" fill="#6E7195">GATES</text>
  <rect x="150" y="352" width="170" height="32" rx="16" fill="#161C42" stroke="#2A3161"/>
  <rect x="150" y="352" width="5" height="32" rx="2.5" fill="#7E96D4"/>
  <text x="166" y="373" class="sans chip">validate 红线</text>
  <rect x="332" y="352" width="126" height="32" rx="16" fill="#161C42" stroke="#2A3161"/>
  <rect x="332" y="352" width="5" height="32" rx="2.5" fill="#9C7BE0"/>
  <text x="348" y="373" class="sans chip">分类词表建议</text>
  <rect x="470" y="352" width="94" height="32" rx="16" fill="#161C42" stroke="#2A3161"/>
  <rect x="470" y="352" width="5" height="32" rx="2.5" fill="#E8CF7E"/>
  <text x="486" y="373" class="sans chip">园主确认</text>
  <rect x="576" y="352" width="190" height="32" rx="16" fill="#161C42" stroke="#2A3161"/>
  <rect x="576" y="352" width="5" height="32" rx="2.5" fill="#74A88A"/>
  <text x="592" y="373" class="sans chip">deploy-cf CI 绿</text>
  <rect x="778" y="352" width="94" height="32" rx="16" fill="#161C42" stroke="#2A3161"/>
  <rect x="778" y="352" width="5" height="32" rx="2.5" fill="#9C7BE0"/>
  <text x="794" y="373" class="sans chip">主域复核</text>

  <!-- footer -->
  <text x="56" y="398" class="mono" font-size="16" fill="#6E7195">post-publish · dynamic-publish · ai-morning-brief · github-weekly-hot</text>
  <text x="1144" y="398" text-anchor="end" class="mono" font-size="16" fill="#6E7195">OWNER-GATED / NO AUTO PUSH</text>
</svg>
