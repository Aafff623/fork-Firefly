<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 萤火虫：圆头 + 提灯，暖黄发光 -->
  <!-- 身体 -->
  <ellipse cx="16" cy="17" rx="7" ry="9" fill="#7c3aed"/>
  <!-- 头 -->
  <circle cx="16" cy="9" r="6" fill="#7c3aed"/>
  <!-- 眼睛 -->
  <circle cx="13.5" cy="8.5" r="1.3" fill="#f5f5f5"/>
  <circle cx="18.5" cy="8.5" r="1.3" fill="#f5f5f5"/>
  <!-- 提灯柄 -->
  <rect x="15" y="16" width="2" height="5" rx="1" fill="#6b21a8"/>
  <!-- 提灯 -->
  <rect x="12" y="20" width="8" height="7" rx="2" fill="#fbbf24"/>
  <rect x="13.5" y="21" width="5" height="5" rx="1" fill="#fef3c7" opacity="0.6"/>
  <!-- 触角 -->
  <path d="M13 4 Q12 2 10 3" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M19 4 Q20 2 22 3" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- 发光尾 -->
  <ellipse cx="16" cy="28" rx="4" ry="3" fill="#fbbf24" opacity="0.35"/>
</svg>
