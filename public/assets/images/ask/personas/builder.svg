<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 基建佬：圆头 + 戴橙安全帽 + 握扳手 -->
  <!-- 头 -->
  <circle cx="16" cy="18" r="8" fill="#7c3aed"/>
  <!-- 眼睛 -->
  <circle cx="13" cy="17" r="1.3" fill="#f5f5f5"/>
  <circle cx="19" cy="17" r="1.3" fill="#f5f5f5"/>
  <!-- 嘴（微笑） -->
  <path d="M13 21 Q16 23 19 21" stroke="#1a1a1a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- 安全帽（顶部弧） -->
  <path d="M6 14 Q16 4 26 14 Z" fill="#fb923c"/>
  <!-- 帽檐 -->
  <rect x="5" y="13" width="22" height="2.5" rx="1" fill="#ea580c"/>
  <!-- 帽顶横条 -->
  <rect x="14" y="6" width="4" height="2" rx="0.5" fill="#ea580c"/>
  <!-- 扳手（右下角） -->
  <g transform="translate(22 22) rotate(45)">
    <rect x="0" y="0" width="8" height="2" fill="#6b7280"/>
    <circle cx="0" cy="1" r="2" fill="none" stroke="#6b7280" stroke-width="1.2"/>
    <circle cx="0" cy="1" r="0.8" fill="#6b7280"/>
  </g>
</svg>
